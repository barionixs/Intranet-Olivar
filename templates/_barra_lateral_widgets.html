{% if barra_comunicados and not ocultar_comunicados %}
<div class="tarjeta tarjeta--mini">
  <h3>Últimos comunicados</h3>
  <ul class="lista-mini-comunicados">
    {% for comunicado in barra_comunicados %}
    <li>
      <a href="{% url 'comunicados:lista' %}">{{ comunicado.titulo }}</a>
      <span class="lista-mini-comunicados__fecha">{{ comunicado.fecha_publicacion|date:"d/m/Y" }}</span>
    </li>
    {% endfor %}
  </ul>
  <a href="{% url 'comunicados:lista' %}" class="ver-todos">Ver todos →</a>
</div>
{% endif %}
